<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Gomitas - Agregar Producto</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 40px; }
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; }
        label { display: block; margin-top: 15px; color: #555; font-weight: bold; }
        input, select { width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 95%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Nuevo Producto</h2>
        <form>
            <label for="codigo">Código del Producto:</label>
            <input type="text" id="codigo" placeholder="Ej: 003" required>
            
            <label for="nombre">Nombre de la Gomita:</label>
            <input type="text" id="nombre" placeholder="Ej: Anillos de Durazno" required>
            
            <label for="cantidad">Cantidad en Inventario:</label>
            <input type="number" id="cantidad" placeholder="0" required>
            
            <label for="precio">Precio (RD$):</label>
            <input type="number" id="precio" step="0.01" placeholder="0.00" required>
            
            <button type="submit">Guardar Producto</button>
        </form>
    </div>
</body>
</html>
