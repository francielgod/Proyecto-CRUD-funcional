<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Gomitas - Inventario</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        h2 { color: #333; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #ff6b6b; color: white; }
        tr:nth-child(even){background-color: #f2f2f2;}
        tr:hover {background-color: #ddd;}
        .action-btn { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; }
        .edit { background-color: #ffd93d; color: #333; }
        .delete { background-color: #ff4c4c; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Inventario Actual - DF Gomitas</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio (RD$)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>001</td>
                    <td>Gomitas de Ositos (Paquete 500g)</td>
                    <td>24</td>
                    <td>250.00</td>
                    <td>
                        <button class="action-btn edit">Editar</button>
                        <button class="action-btn delete">Borrar</button>
                    </td>
                </tr>
                <tr>
                    <td>002</td>
                    <td>Gomitas Ácidas (Paquete 250g)</td>
                    <td>15</td>
                    <td>150.00</td>
                    <td>
                        <button class="action-btn edit">Editar</button>
                        <button class="action-btn delete">Borrar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
