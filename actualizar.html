<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Gomitas - Actualizar Precio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 40px; }
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; }
        label { display: block; margin-top: 15px; color: #555; font-weight: bold; }
        select, input { width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 95%; padding: 12px; background-color: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #e68a00; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Actualizar Precio</h2>
        <form>
            <label for="producto">Seleccione el Producto:</label>
            <select id="producto" required>
                <option value="" disabled selected>Elegir producto...</option>
                <option value="001">Gomitas de Ositos (Paquete 500g)</option>
                <option value="002">Gomitas Ácidas (Paquete 250g)</option>
            </select>
            
            <label for="nuevo_precio">Nuevo Precio (RD$):</label>
            <input type="number" id="nuevo_precio" step="0.01" placeholder="Ej: 160.00" required>
            
            <button type="submit">Aplicar Cambio</button>
        </form>
    </div>
</body>
</html>
